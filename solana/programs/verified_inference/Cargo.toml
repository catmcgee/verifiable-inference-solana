[package]
name = "verified_inference"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verified_inference"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.2"
anchor-spl = { version = "1.0.2", default-features = false, features = ["token", "token_2022"] }
# Modular SDK crates (same versions anchor-lang itself depends on):
# anchor-lang 1.x no longer re-exports the instructions-sysvar load helpers
# or the ed25519 program id, so we take them directly.
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
